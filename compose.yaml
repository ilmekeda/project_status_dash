services:
  preview:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: "no"

  parser:
    build:
      context: ./parser
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - ./generated:/workspace/generated:rw
    entrypoint: ["python3", "parser/parse_projects.py"]
    command: ["projects.md", "-o", "generated/projects.json"]
